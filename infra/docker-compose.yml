# Ambiente de desenvolvimento completo: docker compose -f infra/docker-compose.yml up
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  firebase:
    image: andreysenov/firebase-tools:latest
    command: firebase emulators:start --project memoria-urbana-maceio --only firestore,storage
    working_dir: /home/node/firebase
    volumes: ["../firebase:/home/node/firebase"]
    ports: ["8080:8080", "9199:9199", "4000:4000"]
  api:
    build: ../backend
    env_file: ../backend/env.example
    ports: ["8000:8000"]
    depends_on: [redis, firebase]
  worker:
    build: ../backend
    command: celery -A app.worker.celery_app worker -Q default,media,notify -l info
    env_file: ../backend/env.example
    depends_on: [redis, firebase]
  beat:
    build: ../backend
    command: celery -A app.worker.celery_app beat -l info
    env_file: ../backend/env.example
    depends_on: [redis]
