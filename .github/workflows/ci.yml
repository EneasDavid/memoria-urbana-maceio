name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-e-testes:
    name: Tipos, build e testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Checagem de tipos (tsc)
        run: pnpm exec tsc --noEmit

      - name: Checagem de tipos do login (api/)
        run: pnpm exec tsc -p tsconfig.api.json

      - name: Build de produção (Vite)
        run: pnpm build

      - name: Testes de dados (integridade do conteúdo)
        run: node --experimental-strip-types --no-warnings --test tests/data.test.mjs

      - name: Testes do login (sessão, PKCE, claims, open redirect)
        run: node --experimental-strip-types --no-warnings --test tests/auth.test.mjs

      - name: Testes da narração (trechos, palavra falada, voz pt-BR)
        run: node --experimental-strip-types --no-warnings --test tests/speech.test.mjs

      - name: Testes de integração (smoke no build servido)
        run: node --experimental-strip-types --no-warnings --test tests/smoke.test.mjs

      - name: Segurança de anexos (tipo real, tamanho, poliglotas, scripts, bombas)
        run: node --experimental-strip-types --no-warnings --test tests/media.test.mjs

      - name: SEO (indexável, sitemap, robots, HTML pré-renderizado, JSON-LD)
        run: node --experimental-strip-types --no-warnings --test tests/seo.test.mjs

      - name: Servidor Oracle (API Node, Caddyfile igual à Vercel, deploy seguro)
        run: pnpm build:server && node --experimental-strip-types --no-warnings --test tests/oracle.test.mjs

      - name: Auditoria de dependências (OWASP A06)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  conformidade:
    name: Conformidade (LGPD, acessibilidade, legal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Build de produção (Vite)
        run: pnpm build

      - name: 17 regras legais (privacidade, termos, cookies, LGPD, rastreadores, créditos, riscos)
        run: node --experimental-strip-types --no-warnings --test tests/compliance.test.mjs

      - name: Instalar Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: Acessibilidade WCAG 2.1 AA (axe-core, claro e escuro) e teclado
        run: node --experimental-strip-types --no-warnings --test tests/a11y.test.mjs

      - name: UX e animação (Fitts, Hick, Miller, Doherty, Postel, Jakob…) e ajustes finos de design
        run: node --experimental-strip-types --no-warnings --test tests/ux.test.mjs

      - name: Anexo real no relato (prévia, recodificação sem EXIF, recusa de arquivos perigosos)
        run: node --experimental-strip-types --no-warnings --test tests/attach.test.mjs

      - name: Web Interface Guidelines (Vercel) nas páginas públicas
        run: node --experimental-strip-types --no-warnings --test tests/guidelines.test.mjs

      - name: Prints de revisão visual (claro/escuro, celular/desktop)
        if: always()
        run: pnpm shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints
          path: shots
          retention-days: 14

  backend:
    name: Backend (FastAPI, Celery, RBAC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Testes (pytest)
        run: pytest -q

      - name: Auditoria de dependências (OWASP A06)
        run: pip-audit
        continue-on-error: true
