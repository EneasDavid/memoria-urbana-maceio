name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-e-testes:
    name: Tipos, build e testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Checagem de tipos (tsc)
        run: pnpm exec tsc --noEmit

      - name: Build de produção (Vite)
        run: pnpm build

      - name: Testes de dados (integridade do conteúdo)
        run: node --experimental-strip-types --no-warnings --test tests/data.test.mjs

      - name: Testes de integração (smoke no build servido)
        run: node --experimental-strip-types --no-warnings --test tests/smoke.test.mjs

      - name: Auditoria de dependências (OWASP A06)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
