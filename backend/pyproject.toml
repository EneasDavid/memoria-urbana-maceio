[project]
name = "memoria-urbana-api"
version = "0.1.0"
description = "API, tarefas assíncronas e níveis de acesso do Memória Urbana Maceió"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "celery[redis]>=5.4",
  "firebase-admin>=6.6",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.26", "ruff>=0.8", "pip-audit>=2.7"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "app.core.rbac.require"]
